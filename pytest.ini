[pytest]
# Turn warnings into errors so our own code never regresses silently,
# then explicitly ignore known third-party deprecations from Starlette's
# TestClient (StarletteDeprecationWarning + the anyio BlockingPortal alias).
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
