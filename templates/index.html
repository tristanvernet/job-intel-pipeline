<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Intel Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@latest/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@latest/index.css" />
  <style>
    :root { color-scheme: light; }
    body { font-family:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif; }
    .font-mono, code, kbd { font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace !important; }
    kbd { font-size:10px; background:#27272a; border:1px solid #3f3f46; border-radius:4px; padding:1px 5px; color:#d4d4d8; }
    kbd.light { background:#f4f4f5; border-color:#d4d4d8; color:#52525b; }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-thumb { background:#d4d4d8; border-radius:6px; }
    .row { height:44px; cursor:pointer; border-left:4px solid transparent; }
    .row:hover { background:#fafafa; }
    .row.active { background:rgba(244,244,245,.8); border-left:4px solid #18181b; box-shadow: inset 0 0 0 1px #e4e4e7; }
    .skel { height:44px; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid #f4f4f5; }
    .skel > div { background:#f4f4f5; border-radius:4px; height:12px; animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .row-leaving { transition: height .15s ease, opacity .15s ease; height:0 !important; opacity:0; overflow:hidden; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden antialiased bg-[#f4f5f7] text-zinc-900">

  <!-- COMMAND BAR -->
  <header class="h-11 shrink-0 bg-[#09090b] text-zinc-100 flex items-center gap-3 px-4 border-b border-zinc-800">
    <div class="w-6 h-6 rounded-md bg-zinc-900 border border-zinc-800 flex items-center justify-center text-[10px] font-mono font-semibold">JI</div>
    <h1 class="text-[13px] font-semibold tracking-tight">Job Intel Hub</h1>
    <span class="text-zinc-700">·</span>
    <span id="pipeline-status" class="text-[11px] font-mono tabular-nums text-zinc-400 truncate">connecting…</span>
    <div class="ml-auto hidden lg:flex items-center gap-2 text-[11px] text-zinc-500 font-mono">
      <kbd>j</kbd><kbd>k</kbd> move <span class="text-zinc-700">·</span> <kbd>a</kbd> apply <span class="text-zinc-700">·</span>
      <kbd>s</kbd> save <span class="text-zinc-700">·</span> <kbd>x</kbd> dismiss <span class="text-zinc-700">·</span>
      <kbd>z</kbd> undo <span class="text-zinc-700">·</span> <kbd>/</kbd> search
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="shrink-0 bg-white border-b border-zinc-200">
    <div class="flex items-center gap-1 px-4 pt-2" id="status-tabs" role="tablist">
      <button data-status="new"      class="tab" role="tab">Inbox</button>
      <button data-status="applied"  class="tab" role="tab">Applied</button>
      <button data-status="saved"    class="tab" role="tab">Saved</button>
      <button data-status="archived" class="tab" role="tab">Archived</button>
      <div class="ml-auto pb-1.5 flex items-center gap-2">
        <label class="text-[11px] text-zinc-400 font-mono">sort</label>
        <select id="sort" class="text-xs border border-zinc-300 rounded-md px-1.5 py-1 bg-white text-zinc-800 font-medium focus:outline-none focus:border-zinc-500">
          <option value="score_desc">Best match</option>
          <option value="date_desc">Newest</option>
        </select>
      </div>
    </div>
    <div class="flex items-center gap-2 px-4 py-2">
      <div class="relative w-72">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
        <input id="search" type="text" placeholder="Search company, title, location…" autocomplete="off"
          class="w-full bg-white border border-zinc-300 rounded-md pl-8 pr-3 py-1.5 text-[13px] text-zinc-900 placeholder-zinc-400 focus:outline-none focus:border-zinc-500 transition" />
      </div>
      <span id="result-count" class="text-[11px] font-mono tabular-nums text-zinc-400"></span>
      <span class="w-px h-4 bg-zinc-200"></span>
      <div class="flex gap-1" id="track-filters">
        <button data-track="all"        class="track-btn">All</button>
        <button data-track="internship" class="track-btn">Intern</button>
        <button data-track="full_time"  class="track-btn">Full-Time</button>
      </div>
      <span class="w-px h-4 bg-zinc-200"></span>
      <div class="flex gap-1" id="domain-filters">
        <button data-domain="all"     class="dom-btn">All</button>
        <button data-domain="SWE"     class="dom-btn">SWE</button>
        <button data-domain="Systems" class="dom-btn">Systems</button>
        <button data-domain="AI/ML"   class="dom-btn">AI/ML</button>
      </div>
    </div>
  </div>

  <!-- SPLIT PANE -->
  <main class="flex flex-1 min-h-0">
    <section id="stream" class="w-[45%] min-w-[340px] overflow-y-auto bg-white border-r border-zinc-200" role="listbox" aria-label="Job stream">
      <div id="rows"></div>
    </section>
    <aside id="detail" class="flex-1 overflow-y-auto bg-[#fafafa]" aria-label="Job detail">
      <div class="h-full flex items-center justify-center text-sm text-zinc-500 p-8 text-center">
        Select a role to inspect it.<br/><span class="text-xs text-zinc-500 font-mono mt-1 block">j / k to navigate</span>
      </div>
    </aside>
  </main>

  <!-- UNDO TOAST + ERROR BANNER -->
  <div id="toast" class="hidden fixed bottom-4 right-4 z-50 flex items-center gap-3 px-3.5 py-2 rounded-lg bg-zinc-900 text-zinc-100 border border-zinc-700 text-[13px]"></div>
  <div id="errbar" class="hidden fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg bg-rose-50 border border-rose-300 text-rose-700 text-[13px] font-medium"></div>

  <script>
    // ------------------------------------------------------------------ //
    const state = {
      status:'new', track:'all', domain:'all', search:'', sort:'score_desc',
      jobs:[], cursor:0, detailId:null, loading:true,
    };
    const detailCache = new Map();
    const undoStack = [];
    let toastTimer = null;

    // ---------- utils ---------- //
    const $ = s => document.querySelector(s);
    function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : null; }
    function fmt(n){ return (typeof n === 'number' ? n : 0).toLocaleString('en-US'); }
    function parseTs(s){
      if (!s) return null;
      const d = new Date(String(s).replace(' ', 'T') + (String(s).includes('T') ? '' : 'Z'));
      return isNaN(d) ? null : d;
    }
    function fmtRel(s){
      const d = parseTs(s); if (!d) return '';
      const sec = Math.max(0, (Date.now() - d.getTime()) / 1000);
      if (sec < 3600)  return Math.max(1, Math.round(sec/60)) + 'm';
      if (sec < 86400) return Math.round(sec/3600) + 'h';
      if (sec < 86400*7) return Math.round(sec/86400) + 'd';
      return Math.round(sec/(86400*7)) + 'w';
    }
    async function api(path, opts){
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }
    function showError(msg){
      const el = $('#errbar'); el.textContent = msg; el.classList.remove('hidden');
    }
    function clearError(){ $('#errbar').classList.add('hidden'); }

    // ---------- toast / undo ---------- //
    function showToast(msg, onUndo){
      const t = $('#toast');
      t.innerHTML = `<span>${esc(msg)}</span>` +
        (onUndo ? `<button id="toast-undo" class="font-mono text-[11px] px-2 py-0.5 rounded border border-zinc-600 hover:bg-zinc-800 transition"><kbd>z</kbd> Undo</button>` : '');
      t.classList.remove('hidden');
      if (onUndo) $('#toast-undo').onclick = () => { hideToast(); onUndo(); };
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 3000);
    }
    function hideToast(){ $('#toast').classList.add('hidden'); clearTimeout(toastTimer); }

    // ---------- score tiers ---------- //
    function tier(score){
      if (score >= 90) return { dot:'bg-emerald-500', label:'Excellent' };
      if (score >= 75) return { dot:'bg-sky-500',     label:'Strong' };
      return { dot:'bg-zinc-300', label:'Fair' };
    }

    // ---------- stats / telemetry ---------- //
    async function loadStats(){
      try {
        const a = await api('/api/analytics');
        const set = (st, n) => {
          const b = document.querySelector(`.tab[data-status="${st}"]`);
          if (b) b.querySelector('.cnt').textContent = fmt(n);
        };
        set('new', a.inbox); set('applied', a.applied); set('saved', a.saved); set('archived', a.archived);
        const total = a.inbox + a.applied + a.saved + a.archived;
        const scraped = a.last_scraped ? `Scraped ${fmtRel(a.last_scraped)} ago` : 'Never scraped';
        $('#pipeline-status').textContent = `${scraped} · ${fmt(total)} roles indexed`;
      } catch (e) { $('#pipeline-status').textContent = 'telemetry unavailable'; }
    }

    // ---------- job stream ---------- //
    function skeleton(){
      $('#rows').innerHTML = Array.from({length: 14}, () =>
        `<div class="skel"><div style="width:8px;height:8px;border-radius:99px"></div>
         <div style="width:110px"></div><div style="flex:1"></div><div style="width:60px"></div><div style="width:34px"></div></div>`
      ).join('');
    }

    function chip(text){
      return `<span class="text-[10px] px-1.5 py-px rounded border border-zinc-200 text-zinc-500 font-mono shrink-0">${esc(text)}</span>`;
    }

    function renderRows(){
      const box = $('#rows');
      if (!state.jobs.length){
        box.innerHTML = `<div class="py-16 text-center text-sm font-medium text-zinc-500">
          No positions in this view.
          ${(state.search || state.track !== 'all' || state.domain !== 'all')
            ? '<br/><button onclick="clearFilters()" class="mt-2 text-xs text-sky-700 font-medium hover:underline">Clear filters</button>' : ''}
        </div>`;
        $('#result-count').textContent = '0 results';
        return;
      }
      box.innerHTML = state.jobs.map((j, i) => {
        const t = tier(j.match_score);
        const when = fmtRel(j.date_posted || j.date_discovered);
        return `<div class="row ${i === state.cursor ? 'active' : ''} flex items-center gap-2.5 px-4 border-b border-zinc-100"
                     role="option" aria-selected="${i === state.cursor}" data-id="${j.id}" onclick="selectRow(${i})">
          <span class="w-2 h-2 rounded-full shrink-0 ${t.dot}" title="Match ${j.match_score}% · ${t.label}"></span>
          <span class="w-32 truncate text-[13px] text-zinc-500 shrink-0">${esc(j.company)}</span>
          <span class="flex-1 truncate text-[13px] font-medium text-zinc-900">${esc(j.title)}</span>
          <span class="hidden md:flex gap-1">${chip(String(j.track||'').replace('_',' '))}${chip(j.domain || 'General')}</span>
          <span class="w-8 text-right text-[11px] font-mono tabular-nums text-zinc-400 shrink-0">${when}</span>
        </div>`;
      }).join('');
      $('#result-count').textContent = `${fmt(state.jobs.length)} result${state.jobs.length === 1 ? '' : 's'}`;
    }

    function paintTabs(){
      document.querySelectorAll('.tab').forEach(b => {
        const on = b.dataset.status === state.status;
        b.className = 'tab px-3 py-2 text-[13px] font-medium border-b-2 -mb-px transition ' +
          (on ? 'border-zinc-900 text-zinc-900' : 'border-transparent text-zinc-500 hover:text-zinc-800');
        if (!b.querySelector('.cnt'))
          b.insertAdjacentHTML('beforeend', ' <span class="cnt font-mono tabular-nums text-[11px] opacity-60"></span>');
      });
      const pill = on => on
        ? 'px-2.5 py-1 rounded-md text-xs font-medium bg-zinc-900 text-white transition'
        : 'px-2.5 py-1 rounded-md text-xs font-medium text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 transition';
      document.querySelectorAll('.track-btn').forEach(b => b.className = pill(b.dataset.track === state.track));
      document.querySelectorAll('.dom-btn').forEach(b => b.className = pill(b.dataset.domain === state.domain));
    }

    async function loadJobs(keepCursor){
      clearError();
      try {
        const p = new URLSearchParams({ status: state.status, track: state.track, domain: state.domain, sort: state.sort });
        if (state.search.trim()) p.set('search', state.search.trim());
        state.jobs = await api('/api/jobs?' + p.toString());
        state.cursor = keepCursor ? Math.min(state.cursor, Math.max(0, state.jobs.length - 1)) : 0;
        state.loading = false;
        renderRows();
        if (state.jobs.length) selectRow(state.cursor, true); else renderEmptyDetail();
        loadStats();
      } catch (e) {
        state.loading = false;
        showError('Could not load jobs. Is the server running?');
      }
    }

    function clearFilters(){
      state.search = ''; $('#search').value = '';
      state.track = 'all'; state.domain = 'all';
      paintTabs(); loadJobs();
    }

    // ---------- detail pane ---------- //
    function renderEmptyDetail(){
      state.detailId = null;
      $('#detail').innerHTML = `<div class="h-full flex items-center justify-center text-sm text-zinc-500">Nothing selected.</div>`;
    }

    function selectRow(i, skipScroll){
      if (i < 0 || i >= state.jobs.length) return;
      state.cursor = i;
      document.querySelectorAll('.row').forEach((r, ri) => {
        r.classList.toggle('active', ri === i);
        r.setAttribute('aria-selected', ri === i ? 'true' : 'false');
      });
      const el = document.querySelectorAll('.row')[i];
      if (el && !skipScroll) el.scrollIntoView({ block: 'nearest' });
      loadDetail(state.jobs[i].id);
    }

    async function loadDetail(id){
      state.detailId = id;
      let d = detailCache.get(id);
      if (!d) {
        try { d = await api(`/api/jobs/${id}`); detailCache.set(id, d); }
        catch (e) { showError('Could not load job detail.'); return; }
      }
      if (state.detailId !== id) return;  // cursor moved on while fetching
      renderDetail(d);
    }

    function renderDetail(d){
      const t = tier(d.match_score);
      const url = safeUrl(d.url);
      const matched = Object.keys(d.match?.matched_terms || {}).sort();
      const missingAll = Object.keys(d.match?.missing_terms || {}).sort();
      const MISS_CAP = 6;
      const missing = missingAll.slice(0, MISS_CAP);
      const missingExtra = missingAll.length - missing.length;
      const when = fmtRel(d.date_posted || d.date_discovered);
      const chipsOf = (terms, cls) => terms.map(t2 =>
        `<span class="text-[11px] px-2 py-0.5 rounded-full border font-mono ${cls}">${esc(t2)}</span>`).join('');

      $('#detail').innerHTML = `
      <div class="p-6 max-w-2xl">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <h2 class="text-lg font-semibold tracking-tight leading-snug text-zinc-900">${esc(d.title)}</h2>
            <div class="text-sm font-medium text-zinc-700 mt-1">${esc(d.company)} · ${esc(d.location || 'Location TBD')}</div>
            <div class="flex gap-1.5 mt-2.5">
              ${chip(String(d.track||'').replace('_',' '))}${chip(d.domain || 'General')}
              ${d.is_remote ? chip('remote') : ''}${d.term ? chip(d.term) : ''}
            </div>
          </div>
          ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer"
             class="shrink-0 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-900 border border-zinc-300 hover:bg-zinc-100 transition">View Posting ↗</a>` : ''}
        </div>

        <div class="mt-5 bg-white border border-zinc-200 rounded-lg p-4">
          <div class="flex items-center justify-between mb-2.5">
            <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500">Match fit</span>
            <span class="font-mono text-sm tabular-nums text-zinc-900 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${t.dot}"></span>${d.match_score}% · ${t.label}
            </span>
          </div>
          <div class="flex flex-wrap gap-1.5">${chipsOf(matched, 'border-emerald-200 bg-emerald-50 text-emerald-700')}</div>
          ${missingAll.length ? `<div class="text-xs font-medium text-zinc-500 mt-3 mb-1.5">Not mentioned in this role</div>
          <div class="flex flex-wrap gap-1.5" id="missing-chips">${chipsOf(missing, 'bg-zinc-100 text-zinc-500 border border-zinc-200 font-medium')}
            ${missingExtra > 0 ? `<span onclick="toggleMissing('${d.id}')" class="text-xs text-zinc-500 hover:text-zinc-800 underline cursor-pointer self-center" id="missing-toggle">+${missingExtra} more</span>` : ''}</div>` : ''}
        </div>

        <div class="mt-4 flex items-center gap-2">
          <button onclick="setStatus('${d.id}','applied')" class="px-3 py-1.5 rounded-md text-xs font-semibold bg-zinc-900 text-white hover:bg-zinc-700 transition">Mark Applied <kbd class="light">a</kbd></button>
          <button onclick="setStatus('${d.id}','saved')"   class="px-3 py-1.5 rounded-md text-xs font-medium border border-zinc-300 text-zinc-700 hover:bg-zinc-100 transition">Save <kbd class="light">s</kbd></button>
          <button onclick="setStatus('${d.id}','archived')" class="px-3 py-1.5 rounded-md text-xs font-medium border border-zinc-300 text-zinc-700 hover:bg-zinc-100 transition">Dismiss <kbd class="light">x</kbd></button>
          <button onclick="genPrep('${d.id}')" class="ml-auto px-3 py-1.5 rounded-md text-xs font-medium border border-zinc-300 text-zinc-700 hover:bg-zinc-100 transition">Generate Prep <kbd class="light">p</kbd></button>
        </div>

        ${d.summary ? `<div class="mt-5"><h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Interview prep</h3>
          <p class="text-sm leading-relaxed text-zinc-800">${esc(d.summary)}</p></div>` : ''}
        ${d.tailored_bullets ? `<div class="mt-4"><h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Key alignment</h3>
          <div class="text-sm leading-relaxed text-zinc-800 whitespace-pre-line">${esc(d.tailored_bullets)}</div></div>` : ''}

        <div class="mt-5">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">
            Description <span class="normal-case font-medium text-zinc-500">· posted ${when || 'unknown'} · via ${esc(d.source || 'unknown')}</span>
          </h3>
          <div class="max-h-72 overflow-y-auto bg-white border border-zinc-200 rounded-lg p-4 text-sm leading-relaxed text-zinc-700 whitespace-pre-line">${esc(d.raw_description || 'No description captured for this role.')}</div>
        </div>
      </div>`;
    }

    // Expand the capped 'missing terms' chip set in place.
    function toggleMissing(id){
      const d = detailCache.get(id);
      const box = document.getElementById('missing-chips');
      if (!d || !box) return;
      const all = Object.keys(d.match?.missing_terms || {}).sort();
      box.innerHTML = all.map(t2 =>
        `<span class="text-[11px] px-2 py-0.5 rounded-full font-mono bg-zinc-100 text-zinc-500 border border-zinc-200 font-medium">${esc(t2)}</span>`
      ).join('') + `<span onclick="renderDetail(detailCache.get('${id}'))" class="text-xs text-zinc-500 hover:text-zinc-800 underline cursor-pointer self-center">show less</span>`;
    }

    async function genPrep(id){
      const btn = event?.target;
      if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
      try {
        const r = await api(`/api/jobs/${id}/prep`, { method: 'POST' });
        detailCache.delete(id);
        const j = state.jobs.find(x => String(x.id) === String(id));
        if (j) { j.summary = r.summary; j.tailored_bullets = r.bullets.map(b => '- ' + b).join('\n'); }
        await loadDetail(id);
      } catch (e) {
        showError('Prep generation failed.');
        if (btn) { btn.disabled = false; btn.innerHTML = 'Generate Prep <kbd class="light">p</kbd>'; }
      }
    }

    // ---------- optimistic triage + undo ---------- //
    function setStatus(id, newStatus){
      const idx = state.jobs.findIndex(j => String(j.id) === String(id));
      if (idx === -1) return;
      const job = state.jobs[idx];
      const prevStatus = job.status || state.status;

      // Optimistic local mutation.
      undoStack.push({ id, prevStatus, job, idx });
      job.status = newStatus;
      if (newStatus !== state.status) state.jobs.splice(idx, 1);
      state.cursor = Math.min(state.cursor, Math.max(0, state.jobs.length - 1));
      detailCache.delete(id);
      renderRows();

      if (state.jobs.length) selectRow(state.cursor, true); else renderEmptyDetail();
      loadStats();
      showToast(`Marked ${newStatus}`, undo);

      // Background sync; revert on failure.
      api(`/api/jobs/${id}/status`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      }).catch(() => {
        showError('Status update failed — change reverted.');
        undo();
      });
    }

    async function undo(){
      const u = undoStack.pop();
      if (!u) { showToast('Nothing to undo'); return; }
      hideToast();
      try {
        await api(`/api/jobs/${u.id}/status`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: u.prevStatus }),
        });
      } catch (e) { showError('Undo failed — refresh to resync.'); return; }
      u.job.status = u.prevStatus;
      detailCache.delete(u.id);
      if (u.prevStatus === state.status && !state.jobs.some(j => String(j.id) === String(u.id))) {
        state.jobs.splice(Math.min(u.idx, state.jobs.length), 0, u.job);
      }
      renderRows();
      loadStats();
    }

    // ---------- wiring ---------- //
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.status = b.dataset.status; paintTabs(); loadJobs(); });
    document.querySelectorAll('.track-btn').forEach(b => b.onclick = () => { state.track = b.dataset.track; paintTabs(); loadJobs(); });
    document.querySelectorAll('.dom-btn').forEach(b => b.onclick = () => { state.domain = b.dataset.domain; paintTabs(); loadJobs(); });
    $('#sort').onchange = e => { state.sort = e.target.value; loadJobs(); };

    const searchEl = $('#search');
    let searchTimer = null;
    searchEl.addEventListener('input', e => {
      state.search = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadJobs(), 200);
    });

    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
        if (e.target === searchEl && e.key === 'Escape') searchEl.blur();
        return;
      }
      const cur = state.jobs[state.cursor];
      switch (e.key) {
        case '/': e.preventDefault(); searchEl.focus(); return;
        case 'j': selectRow(Math.min(state.jobs.length - 1, state.cursor + 1)); return;
        case 'k': selectRow(Math.max(0, state.cursor - 1)); return;
        case 'z': undo(); return;
        case 'Escape': renderEmptyDetail(); return;
        case 'Enter': {
          const u = cur && safeUrl(cur.url);
          if (u) window.open(u, '_blank', 'noopener,noreferrer');
          return;
        }
      }
      if (!cur) return;
      if (e.key === 'a') setStatus(cur.id, 'applied');
      if (e.key === 's') setStatus(cur.id, 'saved');
      if (e.key === 'x') setStatus(cur.id, 'archived');
      if (e.key === 'p') genPrep(cur.id);
    });

    // ---------- boot ---------- //
    paintTabs();
    skeleton();
    loadStats();
    loadJobs();
  </script>
</body>
</html>
