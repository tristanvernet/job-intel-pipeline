<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Intel Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@latest/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@latest/index.css" />
  <style>
    :root { color-scheme: light; }
    body { background:#f4f5f7; font-family:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif; }
    .font-mono, code, kbd, pre { font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace !important; }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-thumb { background:#d4d4d8; border-radius:6px; }
    .fade-in { animation: fade .18s ease; }
    @keyframes fade { from { opacity:0; transform:translateY(4px);} to {opacity:1;transform:none;} }
    /* Accordion drawer: height is interpolated by the Tailwind grid-rows +
       opacity classes bound per-card in render(); inner needs min-h-0 so
       0fr can fully collapse. Parent #job-list uses items-start so
       siblings don't stretch when one card opens. */
    .drawer-inner { overflow:hidden; min-height:0; }
    kbd { font-size:11px; font-family:'Geist Mono',ui-monospace,monospace; background:#27272a; background:rgb(39 39 42); border:1px solid #3f3f46; border-radius:4px; padding:1px 6px; color:#d4d4d8; }
    .clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="min-h-screen antialiased bg-[#f4f5f7] text-zinc-900">
  <!-- DARK COMMAND DECK : title through search/filter controls -->
  <div class="bg-[#09090b] text-zinc-100 border-b border-zinc-800 pb-6 pt-5 px-8">
  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <header class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-[11px] font-mono font-semibold text-zinc-100">JI</div>
        <div>
          <h1 class="text-base font-semibold tracking-tight leading-none text-white">Job Intel Hub</h1>
          <p class="text-xs text-zinc-400 mt-0.5">Autonomous sourcing &amp; application command center</p>
        </div>
      </div>
      <div class="text-xs text-zinc-400 hidden md:flex items-center gap-2 font-mono">
        <kbd>/</kbd> search <span class="text-zinc-700">·</span> <kbd>j</kbd>/<kbd>k</kbd> move <span class="text-zinc-700">·</span> <kbd>a</kbd> apply <span class="text-zinc-700">·</span> <kbd>s</kbd> save <span class="text-zinc-700">·</span> <kbd>x</kbd> dismiss
      </div>
    </header>

    <!-- Telemetry strip -->
    <section class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Application Funnel</h2>
        <span id="funnel-momentum" class="text-[11px] text-zinc-400 font-mono tabular-nums"></span>
      </div>
      <div id="funnel" class="bg-zinc-900/90 border border-zinc-800 rounded-2xl flex overflow-x-auto"></div>
    </section>

    <!-- Unified search & filter toolbar (dark) -->
    <div class="flex flex-col gap-2.5">
      <div class="relative flex-1">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
        <input id="search" type="text" placeholder="Search company, title, location…" autocomplete="off"
          class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl pl-9 pr-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-700 focus:ring-1 focus:ring-zinc-700/50 transition" />
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex flex-wrap gap-1.5" id="track-filters">
          <button data-track="all"        class="track-btn px-3 py-1.5 rounded-lg text-xs font-medium">All</button>
          <button data-track="internship" class="track-btn px-3 py-1.5 rounded-lg text-xs font-medium">Intern</button>
          <button data-track="full_time"  class="track-btn px-3 py-1.5 rounded-lg text-xs font-medium">Full-Time</button>
        </div>
        <span class="hidden sm:block w-px h-5 bg-zinc-800"></span>
        <div class="flex flex-wrap gap-1.5" id="domain-filters">
          <button data-domain="all"     class="dom-btn px-3 py-1.5 rounded-lg text-xs font-medium">All</button>
          <button data-domain="SWE"     class="dom-btn px-3 py-1.5 rounded-lg text-xs font-medium">SWE</button>
          <button data-domain="Systems" class="dom-btn px-3 py-1.5 rounded-lg text-xs font-medium">Systems</button>
          <button data-domain="AI/ML"   class="dom-btn px-3 py-1.5 rounded-lg text-xs font-medium">AI/ML</button>
        </div>
      </div>
    </div>
  </div>
  </div><!-- /dark command deck -->

  <!-- WORK SURFACE : light canvas for tabs + feed -->
  <div class="bg-[#f4f5f7]">
  <div class="max-w-7xl mx-auto px-5 py-6">
    <!-- Status tabs -->
    <div class="flex gap-1 border-b border-zinc-200/90 mb-5" id="status-tabs">
      <button data-status="new"      class="tab px-3 py-2 text-sm font-medium border-b-2 -mb-px">Inbox</button>
      <button data-status="applied"  class="tab px-3 py-2 text-sm font-medium border-b-2 -mb-px">Applied</button>
      <button data-status="saved"    class="tab px-3 py-2 text-sm font-medium border-b-2 -mb-px">Saved</button>
      <button data-status="archived" class="tab px-3 py-2 text-sm font-medium border-b-2 -mb-px">Archived</button>
    </div>

    <div id="job-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-start">
      <div class="text-center py-16 text-zinc-400 text-sm col-span-full">Loading pipeline…</div>
    </div>
  </div>
  </div><!-- /work surface -->

  <script>
    const state = { track:'all', domain:'all', status:'new', search:'', jobs:[], cursor:0, expandedJobId:null, limit:24 };

    // Minimal inline error chip: subtle zinc/rose banner, auto-clears on the
    // next successful load so a transient failure never leaves stale UI.
    function showError(msg) {
      let el = document.getElementById('api-error');
      if (!el) {
        el = document.createElement('div');
        el.id = 'api-error';
        el.className = 'fixed bottom-4 right-4 z-50 px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-50 border border-rose-200 text-rose-700 shadow-none';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.style.display = '';
    }
    function clearError() {
      const el = document.getElementById('api-error');
      if (el) el.style.display = 'none';
    }

    const PAGE_INITIAL = 24;
    const PAGE_MORE = 18;

    const ACTIVE_PILL = 'bg-white text-zinc-950 font-semibold text-xs px-3 py-1.5 rounded-lg';
    const IDLE_PILL   = 'bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium text-xs px-3 py-1.5 rounded-lg';

    function fmt(n) { return (typeof n === 'number' ? n : 0).toLocaleString('en-US'); }

    function paintCounts(s) {
      const set = (sel, key, label) => {
        const el = document.querySelector(sel);
        if (el) el.innerHTML = `${label} <span class="font-mono tabular-nums opacity-70">(${fmt(s[key])})</span>`;
      };
      set('[data-track="all"]', 'total', 'All');
      set('[data-track="internship"]', 'internship', 'Intern');
      set('[data-track="full_time"]', 'full_time', 'Full-Time');
      set('[data-domain="SWE"]', 'swe', 'SWE');
      set('[data-domain="Systems"]', 'systems', 'Systems');
      set('[data-domain="AI/ML"]', 'aiml', 'AI/ML');
    }

    function paintToggles() {
      document.querySelectorAll('.track-btn').forEach(b => {
        b.className = 'track-btn transition ' + (b.dataset.track===state.track?ACTIVE_PILL:IDLE_PILL);
      });
      document.querySelectorAll('.dom-btn').forEach(b => {
        b.className = 'dom-btn transition ' + (b.dataset.domain===state.domain?ACTIVE_PILL:IDLE_PILL);
      });
      document.querySelectorAll('.tab').forEach(b => {
        const on = b.dataset.status===state.status;
        b.className = 'tab px-3 py-2 text-sm font-medium border-b-2 -mb-px transition ' +
          (on ? 'border-sky-700 text-sky-700' : 'border-transparent text-zinc-500 hover:text-zinc-800');
      });
    }

    // Match score: top-right widget — numeric badge + micro progress track.
    function matchBadge(score) {
      const s = Math.min(100, Math.max(0, (typeof score === 'number') ? score : 0));
      return `<span title="Match score ${s}%" class="shrink-0 px-1.5 py-0.5 rounded border border-zinc-200 font-mono text-[11px] tabular-nums text-zinc-900">${s}%</span>`;
    }

    function chip(text) {
      return `<span class="text-[11px] px-2 py-0.5 rounded-full border border-zinc-200 text-zinc-600 font-mono" style="background:#f4f4f5;">${text}</span>`;
    }

    // Telemetry strip cells: white mono numbers, zinc-400 labels, zinc-800 dividers.
    function funnelCell(label, value, last) {
      return `<div class="flex-1 min-w-[110px] px-4 py-2.5 ${last ? '' : 'border-r border-zinc-800'}">
        <div class="text-base font-semibold leading-none font-mono tabular-nums text-white">${fmt(value)}</div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 mt-1 font-mono">${label}</div>
      </div>`;
    }

    async function loadAnalytics() {
      let a;
      try {
        const r = await fetch('/api/analytics');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        a = await r.json();
      } catch (e) { showError('Could not load analytics.'); return; }
      document.getElementById('funnel').innerHTML =
        funnelCell('Inbox', a.inbox, false) +
        funnelCell('Applied', a.applied, false) +
        funnelCell('Saved', a.saved, false) +
        funnelCell('Archived', a.archived, false) +
        funnelCell('Last 7 days', a.applied_last_7_days, true);
      const m = document.getElementById('funnel-momentum');
      m.textContent = a.applied_last_7_days > 0
        ? `\u2191 ${a.applied_last_7_days} applied in the last 7 days`
        : 'No applications in the last 7 days';
    }

    async function loadStats() {
      try {
        const r = await fetch('/api/stats');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const s = await r.json();
        paintCounts(s);
        paintToggles();
      } catch (e) { showError('Could not load stats.'); }
    }

    // Lightweight fuzzy: subsequence match + contiguous bonus, client-side.
    function fuzzy(q, text) {
      if (!q) return true;
      q = q.toLowerCase(); text = (text||'').toLowerCase();
      if (text.includes(q)) return true;
      let i = 0;
      for (const ch of text) { if (ch === q[i]) i++; if (i === q.length) return true; }
      return false;
    }

    function filteredJobs() {
      const q = state.search.trim();
      if (!q) return state.jobs;
      return state.jobs.filter(j => fuzzy(q, `${j.company} ${j.title} ${j.location||''}`));
    }

    // Lazy-render slicing: only mount the first `limit` cards in the DOM.
    function visibleJobs() {
      return filteredJobs().slice(0, state.limit);
    }

    function resetLimit() { state.limit = PAGE_INITIAL; }

    function maybeGrow() {
      if (state.limit < filteredJobs().length) { state.limit += PAGE_MORE; render(); }
    }

    let sentinelObserver = null;
    function observeSentinel() {
      if (sentinelObserver) sentinelObserver.disconnect();
      const el = document.getElementById('scroll-sentinel');
      if (!el || typeof IntersectionObserver === 'undefined') return;
      sentinelObserver = new IntersectionObserver((entries) => {
        if (entries.some(e => e.isIntersecting)) maybeGrow();
      }, { rootMargin: '400px' });
      sentinelObserver.observe(el);
    }

    function footerActions(j) {
      const btn = (label, status) =>
        `<button onclick="event.stopPropagation();setStatus('${j.id}','${status}')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-600 border border-zinc-200 hover:border-zinc-300 hover:text-zinc-900 hover:bg-zinc-50 transition">${label}</button>`;
      const safeUrl = /^https?:\/\//i.test(j.url || '') ? j.url : '#';
      let out = `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-900 border border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 transition">View ↗</a>`;
      if (state.status !== 'applied') out += btn('Applied','applied');
      if (state.status !== 'saved')   out += btn('Save','saved');
      if (state.status !== 'archived')out += btn('Dismiss','archived');
      return out;
    }

    // Parse raw bullet strings ("- foo\n- bar", "• foo", "* foo") into clean items.
    function bulletsToItems(input) {
      if (Array.isArray(input)) input = input.join('\n');
      const raw = String(input || '');
      let parts = raw.split(/\r?\n/);
      if (parts.length <= 1) parts = raw.split(/;\s*(?=-|•|\*)/);
      const items = [];
      for (let p of parts) {
        p = p.trim().replace(/^[-•*]\s*/, '').trim();
        if (p) items.push(p);
      }
      return items;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderBullets(input) {
      const items = bulletsToItems(input);
      if (!items.length) return '';
      return `<ul class="mt-1.5 space-y-1 list-disc list-outside ml-4 text-zinc-600">` +
        items.map(b => `<li>${esc(b)}</li>`).join('') + `</ul>`;
    }

    function previewSnippet(j) {
      if (j.summary) return j.summary;
      const items = bulletsToItems(j.tailored_bullets);
      if (items.length) return items.slice(0, 2).join(' · ');
      return `${j.domain || ''} · ${String(j.track || '').replace('_', ' ')}`.trim();
    }

    function expandedDetails(j) {
      if (!j.summary && !j.tailored_bullets && j._prepLoading) {
        return `<p class="text-xs text-zinc-400">Loading prep…</p>`;
      }
      const bullets = renderBullets(j.tailored_bullets);
      return `
        ${j.summary ? `<div><h4 class="text-[11px] font-semibold uppercase tracking-wide text-zinc-500 mb-1">Interview prep</h4><p class="text-xs leading-relaxed text-zinc-600">${esc(j.summary)}</p></div>` : ''}
        ${bullets ? `<div class="mt-3"><h4 class="text-[11px] font-semibold uppercase tracking-wide text-zinc-500 mb-1">Key alignment</h4><div class="text-xs leading-relaxed">${bullets}</div></div>` : ''}
        ${(!j.summary && !bullets) ? `<p class="text-xs text-zinc-400">Click to load interview prep for this role.</p>` : ''}`;
    }

    function drawerClass(open) {
      return 'grid transition-[grid-template-rows,opacity] duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] ' +
        (open ? 'grid-rows-[1fr] opacity-100 mt-4 pt-4 border-t border-zinc-100'
              : 'grid-rows-[0fr] opacity-0 mt-0 pt-0 border-t border-transparent');
    }
    function setDrawer(jobId, open) {
      const d = document.querySelector('[data-drawer="' + jobId + '"]');
      if (!d) return false;
      d.className = drawerClass(open);
      return true;
    }
    function setRing(cardEl, on) {
      if (!cardEl || !cardEl.classList) return;
      cardEl.classList.remove('border-sky-700/50', 'ring-1', 'ring-sky-700/20', 'border-zinc-200', 'hover:border-zinc-300');
      if (on) cardEl.classList.add('border-sky-700/50', 'ring-1', 'ring-sky-700/20');
      else cardEl.classList.add('border-zinc-200', 'hover:border-zinc-300');
    }
    function cardClick(idx, jobId) {
      state.cursor = idx;
      document.querySelectorAll('#job-list [data-card]').forEach(el => {
        setRing(el, el.getAttribute('data-card') === String(jobId));
      });
      toggleExpand(jobId);
    }
    // Surgical toggle: flip live drawer classes so the grid-rows transition
    // actually plays. No innerHTML rebuild, so no jank / scroll jump.
    // Full render() still handles prep-load completion, filters, and keys.
    function toggleExpand(jobId) {
      jobId = String(jobId);
      const prev = (state.expandedJobId == null) ? null : String(state.expandedJobId);
      if (prev === jobId) {
        state.expandedJobId = null;
        if (!setDrawer(jobId, false)) render();
        return;
      }
      state.expandedJobId = jobId;
      if (prev) setDrawer(prev, false);
      const j = state.jobs.find(x => String(x.id) === jobId);
      if (j && !j.summary && !j.tailored_bullets && !j._prepLoading) { prep(jobId); return; }
      if (!setDrawer(jobId, true)) render();
    }

    function logoInitial(company) {
      const c = String(company || '?').trim();
      return esc((c[0] || '?').toUpperCase());
    }

    function render() {
      const list = document.getElementById('job-list');
      const jobs = visibleJobs();
      if (state.cursor >= jobs.length) state.cursor = Math.max(0, jobs.length-1);
      if (!jobs.length) {
        list.innerHTML = '<div class="text-center py-16 text-zinc-400 text-sm col-span-full">No positions in this view.</div>';
        return;
      }
      list.innerHTML = jobs.map((j,idx) => {
        const expanded = String(state.expandedJobId) === String(j.id);
        const focus = idx===state.cursor ? 'border-sky-700/50 ring-1 ring-sky-700/20' : 'border-zinc-200 hover:border-zinc-300';
        return `<article data-card="${j.id}" class="fade-in bg-white border ${focus} rounded-2xl p-4 transition flex flex-col cursor-pointer" onclick="cardClick(${idx},'${j.id}')">
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-full border border-zinc-200 flex items-center justify-center text-xs font-semibold text-zinc-700 shrink-0" style="background:#f4f4f5;">${logoInitial(j.company)}</div>
            <div class="min-w-0 flex-1">
              <h2 class="text-sm font-semibold leading-snug truncate" style="color:#18181b;">${esc(j.title)}</h2>
              <div class="text-xs text-zinc-600 mt-0.5 truncate">${esc(j.company)}</div>
            </div>
            ${matchBadge(j.match_score)}
          </div>
          <div class="flex items-center gap-1.5 mt-2.5 flex-wrap">
            ${chip(esc(String(j.track || '').replace('_',' ').toUpperCase()))}
            ${chip(esc(j.domain || 'General'))}
            ${j.is_remote ? chip('REMOTE') : ''}
          </div>
          <div class="mt-2.5 space-y-1 text-xs text-zinc-600">
            <div class="flex items-center gap-1.5 truncate">
              <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <span class="truncate">${esc(j.location || 'Location TBD')}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/></svg>
              <span class="font-mono text-[11px] tabular-nums text-zinc-500">${esc(j.term || j.posted || 'See posting')}</span>
            </div>
          </div>
          <p class="clamp-2 text-xs leading-relaxed text-zinc-500 mt-2.5">${esc(previewSnippet(j))}</p>
          <div data-drawer="${j.id}" class="${drawerClass(expanded)}"><div class="overflow-hidden min-h-0">
            <div class="${expanded ? 'fade-in' : ''}">${expandedDetails(j)}</div>
          </div></div>
          <div class="flex items-center gap-1.5 mt-auto pt-3 mt-3 border-t border-zinc-100" onclick="event.stopPropagation()">${footerActions(j)}</div>
        </article>`;
      }).join('');
      const total = filteredJobs().length;
      if (total > jobs.length) {
        list.innerHTML += `<div id="scroll-sentinel" class="col-span-full text-center py-6 text-xs text-zinc-400 font-mono tabular-nums">Showing ${jobs.length} of ${fmt(total)} — scroll for more</div>`;
      }
      observeSentinel();
    }

    async function loadJobs() {
      try {
        const p = new URLSearchParams({ track:state.track, domain:state.domain, status:state.status });
        const r = await fetch('/api/jobs?'+p.toString());
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        state.jobs = await r.json();
        state.cursor = 0;
        state.expandedJobId = null;
        resetLimit();
        clearError();
        render();
        loadStats();
        loadAnalytics();
      } catch (e) {
        showError('Could not load jobs. Is the server running?');
        state.jobs = [];
        render();
      }
    }

    async function setStatus(jobId, status) {
      try {
        const r = await fetch(`/api/jobs/${jobId}/status`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status})
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        loadJobs();
      } catch (e) { showError('Status update failed.'); }
    }

    async function prep(jobId) {
      const j = state.jobs.find(x => String(x.id) === String(jobId));
      if (j) { j._prepLoading = true; if (String(state.expandedJobId) === String(jobId)) render(); }
      try {
        const res = await fetch(`/api/jobs/${jobId}/prep`, {method:'POST'});
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const r = await res.json();
        if (j) { j.summary = r.summary; j.tailored_bullets = r.bullets.map(b=>'- '+b).join('\n'); }
      } catch (e) {
        showError('Prep generation failed.');
      } finally {
        if (j) { j._prepLoading = false; render(); }
      }
    }

    // Wire up controls
    document.querySelectorAll('.track-btn').forEach(b => b.onclick = () => { state.track=b.dataset.track; paintToggles(); loadJobs(); });
    document.querySelectorAll('.dom-btn').forEach(b => b.onclick = () => { state.domain=b.dataset.domain; paintToggles(); loadJobs(); });
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.status=b.dataset.status; paintToggles(); loadJobs(); });

    const searchEl = document.getElementById('search');
    let searchTimer = null;
    searchEl.addEventListener('input', e => {
      state.search = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { resetLimit(); render(); }, 120);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
        if (e.target === searchEl && e.key==='Escape') searchEl.blur();
        return;
      }
      const jobs = visibleJobs();
      if (e.key === '/') { e.preventDefault(); searchEl.focus(); return; }
      if (e.key === 'j') { state.cursor = Math.min(jobs.length-1, state.cursor+1); render(); }
      if (e.key === 'k') { state.cursor = Math.max(0, state.cursor-1); render(); }
      const cur = jobs[state.cursor];
      if (!cur) return;
      if (e.key === 'a') setStatus(cur.id, 'applied');
      if (e.key === 's') setStatus(cur.id, 'saved');
      if (e.key === 'x') setStatus(cur.id, 'archived');
      if (e.key === 'p') prep(cur.id);
      if (e.key === 'Enter' && /^https?:\/\//i.test(cur.url || '')) window.open(cur.url, '_blank', 'noopener,noreferrer');
    });

    paintToggles();
    loadJobs();
  </script>
</body>
</html>
