<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Intel Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@latest/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@latest/index.css" />
  <style>
    :root { color-scheme: dark; }
    body { font-family:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif; }
    .font-mono, code, kbd { font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace !important; }
    kbd { font-size:10px; background:#27272a; border:1px solid #3f3f46; border-radius:4px; padding:1px 5px; color:#d4d4d8; }
    kbd.light { background:#3f3f46; border-color:#52525b; color:#e4e4e7; }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-track { background:#09090b; }
    ::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:6px; border:2px solid #09090b; }
    ::-webkit-scrollbar-thumb:hover { background:#52525b; }
    .row { height:44px; cursor:pointer; border-left:4px solid transparent; transition:background .12s ease; }
    .row:hover { background:rgba(24,24,27,.6); }
    .row.active { background:rgba(39,39,42,.8); border-left:4px solid #38bdf8; box-shadow: inset 0 0 0 1px rgba(63,63,70,.6); }
    .skel { height:44px; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid #18181b; }
    .skel > div { background:#27272a; border-radius:4px; height:12px; animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    #errbar { transition: opacity .3s ease, transform .3s ease; }
    #errbar.fade { opacity:0; transform: translate(-50%,-4px); pointer-events:none; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden antialiased bg-zinc-950 text-zinc-100">

  <!-- COMMAND BAR -->
  <header class="h-11 shrink-0 bg-zinc-900/90 border-b border-zinc-800 backdrop-blur flex items-center gap-3 px-4">
    <div class="w-6 h-6 rounded-md bg-zinc-900 border border-zinc-800 flex items-center justify-center text-[10px] font-mono font-semibold text-zinc-100">JI</div>
    <h1 class="text-[13px] font-semibold tracking-tight text-zinc-100">Job Intel Hub</h1>
    <span class="text-zinc-700">·</span>
    <span id="pipeline-status" class="text-[11px] font-mono tabular-nums text-zinc-400 truncate">connecting…</span>
    <div class="ml-auto hidden lg:flex items-center gap-2 text-[11px] text-zinc-400 font-mono">
      <kbd>j</kbd><kbd>k</kbd> move <span class="text-zinc-700">·</span> <kbd>a</kbd> apply <span class="text-zinc-700">·</span>
      <kbd>s</kbd> save <span class="text-zinc-700">·</span> <kbd>x</kbd> dismiss <span class="text-zinc-700">·</span>
      <kbd>z</kbd> undo <span class="text-zinc-700">·</span> <kbd>/</kbd> search
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="shrink-0 bg-zinc-950 border-b border-zinc-800">
    <div class="flex items-center gap-1 px-4 pt-2" id="status-tabs" role="tablist">
      <button data-status="new"      class="tab" role="tab">Inbox</button>
      <button data-status="applied"  class="tab" role="tab">Applied</button>
      <button data-status="saved"    class="tab" role="tab">Saved</button>
      <button data-status="archived" class="tab" role="tab">Archived</button>
      <div class="ml-auto pb-1.5 flex items-center gap-2">
        <label class="text-[11px] text-zinc-400 font-mono font-medium">sort</label>
        <select id="sort" class="text-xs border border-zinc-700 rounded-md px-1.5 py-1 bg-zinc-900 text-zinc-200 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/40 cursor-pointer">
          <option value="score_desc">Best match</option>
          <option value="date_desc">Newest</option>
        </select>
      </div>
    </div>
    <div class="flex items-center gap-2 px-4 py-2">
      <div class="relative w-72">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
        <input id="search" type="text" placeholder="Search company, title, location…" autocomplete="off"
          class="w-full bg-zinc-900 border border-zinc-700 rounded-md pl-8 pr-3 py-1.5 text-[13px] text-zinc-100 placeholder-zinc-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition" />
      </div>
      <span id="result-count" class="text-[11px] font-mono tabular-nums text-zinc-400 font-medium"></span>
      <span class="w-px h-4 bg-zinc-800"></span>
      <div class="flex gap-1" id="track-filters">
        <button data-track="all"        class="track-btn">All</button>
        <button data-track="internship" class="track-btn">Intern</button>
        <button data-track="full_time"  class="track-btn">Full-Time</button>
      </div>
      <span class="w-px h-4 bg-zinc-800"></span>
      <div class="flex gap-1" id="domain-filters">
        <button data-domain="all"     class="dom-btn">All</button>
        <button data-domain="SWE"     class="dom-btn">SWE</button>
        <button data-domain="Systems" class="dom-btn">Systems</button>
        <button data-domain="AI/ML"   class="dom-btn">AI/ML</button>
      </div>
    </div>
  </div>

  <!-- SPLIT PANE -->
  <main class="flex flex-1 min-h-0">
    <section id="stream" class="w-[45%] min-w-[340px] overflow-y-auto bg-zinc-950 border-r border-zinc-800" role="grid" aria-label="Job stream">
      <div id="rows" role="rowgroup"></div>
    </section>
    <aside id="detail" class="flex-1 overflow-y-auto bg-zinc-950" aria-label="Job detail">
      <div class="h-full flex items-center justify-center text-sm text-zinc-400 p-8 text-center">
        Select a role to inspect it.<br/><span class="text-xs text-zinc-400 font-mono font-medium mt-1 block">j / k to navigate</span>
      </div>
    </aside>
  </main>

  <!-- UNDO TOAST + ERROR BANNER -->
  <div id="toast" class="hidden fixed bottom-4 right-4 z-50 flex items-center gap-3 px-3.5 py-2 rounded-lg bg-zinc-800 text-zinc-100 border border-zinc-700 text-[13px]"></div>
  <div id="errbar" class="fade hidden fixed top-14 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2.5 px-4 py-2 rounded-lg bg-rose-950/90 border border-rose-800 text-rose-200 text-[13px] font-medium"></div>

  <script>
    // ------------------------------------------------------------------ //
    const state = {
      status:'new', track:'all', domain:'all', search:'', sort:'score_desc',
      jobs:[], selectedId:null, loading:true, scraperRunning:null, pipelineTotal:null,
    };
    const detailCache = new Map();
    const prepUpdates = new Map();
    const undoStack = [];
    const pendingMutations = new Map();
    let operationSequence = 0;
    let listGeneration = 0;
    let listController = null;
    let detailGeneration = 0;
    let toastTimer = null;
    let toastOperationId = null;
    const UNDO_MS = 5000;
    let errorTimeout = null;

    // ---------- utils ---------- //
    const $ = s => document.querySelector(s);
    const viewKey = () => JSON.stringify([state.status, state.track, state.domain, state.search.trim(), state.sort]);
    const selectedIndex = () => state.jobs.findIndex(j => String(j.id) === state.selectedId);
    const selectedJob = () => state.jobs.find(j => String(j.id) === state.selectedId);
    function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function safeUrl(value){
      try {
        const raw = String(value);
        // URL parsing otherwise silently strips tabs/newlines and edge controls.
        if (/[\u0000-\u001f\u007f-\u009f]/u.test(raw)) return null;
        const url = new URL(raw);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
      } catch { return null; }
    }
    function postingLink(value){
      const url = safeUrl(value);
      const el = document.createElement(url ? 'a' : 'span');
      el.textContent = url ? 'View Posting ↗' : 'Posting unavailable';
      el.className = 'shrink-0 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-100 bg-zinc-900 border border-zinc-700';
      if (url) {
        el.href = url;
        el.target = '_blank';
        el.rel = 'noopener noreferrer';
        el.classList.add('hover:bg-zinc-800', 'transition');
      }
      return el;
    }
    function fmt(n){ return (typeof n === 'number' ? n : 0).toLocaleString('en-US'); }
    function parseTs(s){
      if (!s) return null;
      const d = new Date(String(s).replace(' ', 'T') + (String(s).includes('T') ? '' : 'Z'));
      return isNaN(d) ? null : d;
    }
    function fmtRel(s){
      const d = parseTs(s); if (!d) return '';
      const sec = Math.max(0, (Date.now() - d.getTime()) / 1000);
      if (sec < 3600)  return Math.max(1, Math.round(sec/60)) + 'm';
      if (sec < 86400) return Math.round(sec/3600) + 'h';
      if (sec < 86400*7) return Math.round(sec/86400) + 'd';
      return Math.round(sec/(86400*7)) + 'w';
    }
    async function api(path, opts){
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    // ---------- error banner: auto-dismiss after 4s, manual ×, fade ---------- //
    function showError(msg){
      clearTimeout(errorTimeout);
      const el = $('#errbar');
      el.innerHTML = `<span>${esc(msg)}</span>
        <button data-action="clear-error" class="text-rose-300 hover:text-rose-100 font-bold leading-none" aria-label="Dismiss error">×</button>`;
      el.classList.remove('hidden', 'fade');
      errorTimeout = setTimeout(() => el.classList.add('fade'), 4000);
    }
    function clearError(){
      clearTimeout(errorTimeout);
      $('#errbar').classList.add('fade');
    }

    // ---------- toast / undo ---------- //
    function showToast(msg, onUndo, operationId = null){
      hideToast();
      toastOperationId = operationId;
      const t = $('#toast');
      t.innerHTML = `<span>${esc(msg)}</span>` +
        (onUndo ? `<button id="toast-undo" class="font-mono text-[11px] px-2 py-0.5 rounded border border-zinc-600 hover:bg-zinc-700 transition"><kbd>z</kbd> Undo</button>` : '');
      t.classList.remove('hidden');
      if (onUndo) $('#toast-undo').onclick = () => onUndo();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, UNDO_MS);
    }
    function hideToast(evict = true){
      if (evict && toastOperationId !== null) removeUndo(toastOperationId);
      toastOperationId = null;
      $('#toast').classList.add('hidden');
      clearTimeout(toastTimer);
    }

    // ---------- score tiers ---------- //
    function tier(score){
      if (score >= 90) return { dot:'bg-emerald-400', label:'Excellent' };
      if (score >= 75) return { dot:'bg-sky-400',     label:'Strong' };
      return { dot:'bg-zinc-500', label:'Fair' };
    }

    // ---------- stats / telemetry ---------- //
    async function loadStats(){
      try {
        const a = await api('/api/analytics');
        const set = (st, n) => {
          const b = document.querySelector(`.tab[data-status="${st}"]`);
          if (b) b.querySelector('.cnt').textContent = fmt(n);
        };
        set('new', a.inbox); set('applied', a.applied); set('saved', a.saved); set('archived', a.archived);
        const total = a.inbox + a.applied + a.saved + a.archived;
        state.scraperRunning = a.scraper_running;
        state.pipelineTotal = total;
        if (!state.loading && !state.jobs.length) renderRows();
        const scraped = a.scraper_running ? 'Collecting roles…' :
          (a.last_scraped ? `Last discovery ${fmtRel(a.last_scraped)} ago` : 'No discoveries yet');
        $('#pipeline-status').textContent = `${scraped} · ${fmt(total)} roles indexed`;
      } catch (e) { $('#pipeline-status').textContent = 'telemetry unavailable'; }
    }

    // ---------- job stream ---------- //
    function skeleton(){
      $('#rows').innerHTML = Array.from({length: 14}, () =>
        `<div class="skel"><div style="width:8px;height:8px;border-radius:99px"></div>
         <div style="width:110px"></div><div style="flex:1"></div><div style="width:60px"></div><div style="width:34px"></div></div>`
      ).join('');
    }

    function chip(text){
      return `<span class="text-[10px] px-1.5 py-px rounded bg-zinc-900 text-zinc-300 border border-zinc-800 font-medium font-mono shrink-0">${esc(text)}</span>`;
    }

    function renderRows(){
      const box = $('#rows');
      if (!state.jobs.length){
        const filtered = state.search.trim() || state.track !== 'all' || state.domain !== 'all';
        const running = state.scraperRunning === true;
        const message = filtered ? 'No roles match your search or filters.' :
          running ? 'Collecting roles. New results will be available when collection finishes.' :
          state.pipelineTotal === 0 ? 'No roles collected yet. Run python worker.py to get started.' :
          state.status === 'new' && state.pipelineTotal > 0 ? 'Inbox zero — all collected jobs have been triaged.' :
          'No roles in this view yet.';
        box.innerHTML = `<div class="py-16 text-center text-sm font-medium text-zinc-400" role="status">
          ${running ? '<span class="inline-block w-2 h-2 mr-2 rounded-full bg-sky-400 animate-pulse" aria-hidden="true"></span>' : ''}
          ${esc(message)}
          ${filtered ? '<br/><button data-action="clear-filters" class="mt-2 text-xs text-sky-400 hover:underline">Clear search/filters</button>' : ''}
        </div>`;
        $('#result-count').textContent = '0 results';
        return;
      }
      box.innerHTML = state.jobs.map((j, i) => {
        const t = tier(j.match_score);
        const when = fmtRel(j.date_posted || j.date_discovered);
        return `<div class="row ${String(j.id) === state.selectedId ? 'active' : ''} flex items-center gap-2.5 px-4 border-b border-zinc-900"
                     role="row" tabindex="0" aria-selected="${String(j.id) === state.selectedId}" data-id="${esc(j.id)}">
          <span role="gridcell" class="w-2 h-2 rounded-full shrink-0 ${t.dot}" title="Match ${j.match_score}% · ${t.label}"></span>
          <span role="gridcell" class="w-32 truncate text-[13px] text-zinc-300 shrink-0">${esc(j.company)}</span>
          <span role="gridcell" class="flex-1 truncate text-[13px] font-medium text-zinc-100">${esc(j.title)}</span>
          <span role="gridcell" class="hidden md:flex gap-1">${chip(String(j.track||'').replace('_',' '))}${chip(j.domain || 'General')}</span>
          <span role="gridcell" class="w-8 text-right text-[11px] font-mono tabular-nums text-zinc-400 font-medium shrink-0">${when}</span>
        </div>`;
      }).join('');
      $('#result-count').textContent = `${fmt(state.jobs.length)} result${state.jobs.length === 1 ? '' : 's'}`;
    }

    function paintTabs(){
      document.querySelectorAll('.tab').forEach(b => {
        const on = b.dataset.status === state.status;
        b.className = 'tab px-3 py-2 text-[13px] border-b-2 -mb-px transition ' +
          (on ? 'border-sky-500 text-zinc-100 font-medium' : 'border-transparent text-zinc-400 hover:text-zinc-200');
        if (!b.querySelector('.cnt'))
          b.insertAdjacentHTML('beforeend', ' <span class="cnt font-mono tabular-nums text-[11px]"></span>');
      });
      paintPills('.track-btn', 'track', state.track);
      paintPills('.dom-btn', 'domain', state.domain);
    }

    const PILL_ON  = 'px-2.5 py-1 rounded-md text-xs font-medium bg-zinc-800 text-zinc-100 border border-zinc-600 transition';
    const PILL_OFF = 'px-2.5 py-1 rounded-md text-xs font-medium bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 transition';

    function paintPills(selector, attr, value){
      document.querySelectorAll(selector).forEach(b => {
        const ident = selector.slice(1); // track-btn | dom-btn
        b.className = ident + ' ' + (b.dataset[attr] === value ? PILL_ON : PILL_OFF);
      });
    }

    function invalidateList(){
      listController?.abort();
      ++listGeneration;
      ++detailGeneration;
      state.loading = true;
      state.jobs = [];
      $('#stream').setAttribute('aria-busy', 'true');
      $('#result-count').textContent = 'Loading…';
      skeleton();
      $('#detail').innerHTML = '<div class="p-6 text-sm text-zinc-400">Loading view…</div>';
    }

    function reconcileSelection(preferredId = state.selectedId, fallbackIndex = 0){
      const index = state.jobs.findIndex(j => String(j.id) === preferredId);
      state.selectedId = index >= 0 ? preferredId : null;
      renderRows();
      if (state.jobs.length) selectRow(index >= 0 ? index : Math.min(fallbackIndex, state.jobs.length - 1));
      else renderEmptyDetail();
    }

    async function loadJobs(keepSelection = false){
      const preferredId = keepSelection ? state.selectedId : null;
      invalidateList();
      const generation = listGeneration;
      const key = viewKey();
      const controller = new AbortController();
      listController = controller;
      try {
        // Rows are disabled while loading. Wait for our outstanding writes so
        // the fetched view cannot resurrect a still-pending optimistic action.
        await Promise.allSettled([...pendingMutations.values()]);
        if (generation !== listGeneration || controller.signal.aborted) return;
        const p = new URLSearchParams({ status: state.status, track: state.track, domain: state.domain, sort: state.sort });
        if (state.search.trim()) p.set('search', state.search.trim());
        const jobs = await api('/api/jobs?' + p.toString(), { signal: controller.signal });
        if (generation !== listGeneration || key !== viewKey()) return;
        state.jobs = jobs;
        clearError();  // stale banner from a failed attempt must not linger
        state.loading = false;
        $('#stream').setAttribute('aria-busy', 'false');
        reconcileSelection(preferredId);
        loadStats();
      } catch (e) {
        if (generation !== listGeneration || e.name === 'AbortError') return;
        state.loading = false;
        $('#stream').setAttribute('aria-busy', 'false');
        $('#rows').innerHTML = '<div class="p-6 text-sm text-zinc-400">Could not load this view. <button data-action="retry-list" class="text-sky-400">Retry</button></div>';
        $('#result-count').textContent = 'Unavailable';
        renderEmptyDetail();
        showError('Could not load jobs. Is the server running?');
      }
    }

    function clearFilters(){
      state.search = ''; $('#search').value = '';
      state.track = 'all'; state.domain = 'all';
      paintTabs(); loadJobs();
    }

    // ---------- detail pane ---------- //
    function renderEmptyDetail(){
      state.selectedId = null;
      ++detailGeneration;
      document.querySelectorAll('.row').forEach(r => {
        r.classList.remove('active');
        r.setAttribute('aria-selected', 'false');
      });
      $('#detail').innerHTML = `<div class="h-full flex items-center justify-center text-sm text-zinc-400">Nothing selected.</div>`;
    }

    function selectRow(i, skipScroll){
      if (state.loading || i < 0 || i >= state.jobs.length) return;
      state.selectedId = String(state.jobs[i].id);
      document.querySelectorAll('.row').forEach((r, ri) => {
        r.classList.toggle('active', ri === i);
        r.setAttribute('aria-selected', ri === i ? 'true' : 'false');
      });
      const el = document.querySelectorAll('.row')[i];
      if (el && !skipScroll) el.scrollIntoView({ block: 'nearest' });
      loadDetail(state.jobs[i].id);
    }

    async function loadDetail(id){
      id = String(id);
      if (state.loading || state.selectedId !== id) return;
      const generation = ++detailGeneration;
      let d = detailCache.get(id);
      if (!d) {
        $('#detail').innerHTML = '<div class="p-6 text-sm text-zinc-400">Loading job…</div>';
        try {
          d = await api(`/api/jobs/${encodeURIComponent(id)}`);
          if (generation !== detailGeneration || state.selectedId !== id || state.loading) return;
          detailCache.set(id, d);
        } catch (e) {
          if (generation === detailGeneration && state.selectedId === id) {
            $('#detail').innerHTML = '<div class="p-6 text-sm text-zinc-400">Could not load job detail.</div>';
            showError('Could not load job detail.');
          }
          return;
        }
      }
      if (generation !== detailGeneration || state.selectedId !== id || state.loading) return;
      Object.assign(d, prepUpdates.get(id) || {});
      renderDetail(d);
    }

    function renderDetail(d){
      if (!d || state.loading || String(d.id) !== state.selectedId) return;
      const t = tier(d.match_score);
      const matched = Object.keys(d.match?.matched_terms || {}).sort();
      const missingAll = Object.keys(d.match?.missing_terms || {}).sort();
      const MISS_CAP = 6;
      const missing = missingAll.slice(0, MISS_CAP);
      const missingExtra = missingAll.length - missing.length;
      const when = fmtRel(d.date_posted || d.date_discovered);
      const chipsOf = (terms, cls) => terms.map(t2 =>
        `<span class="text-[11px] px-2 py-0.5 rounded-full border font-mono ${cls}">${esc(t2)}</span>`).join('');

      $('#detail').innerHTML = `
      <div class="p-6 max-w-2xl">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <h2 class="text-lg font-semibold tracking-tight leading-snug text-zinc-100">${esc(d.title)}</h2>
            <div class="text-sm text-zinc-300 mt-1">${esc(d.company)} · ${esc(d.location || 'Location TBD')}</div>
            <div class="flex gap-1.5 mt-2.5">
              ${chip(String(d.track||'').replace('_',' '))}${chip(d.domain || 'General')}
              ${d.is_remote ? chip('remote') : ''}${d.term ? chip(d.term) : ''}
            </div>
          </div>
          <span id="posting-link" class="shrink-0"></span>
        </div>

        <div class="mt-5 bg-zinc-900/60 border border-zinc-800 rounded-lg p-4">
          <div class="flex items-center justify-between mb-2.5">
            <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 font-medium">Match fit</span>
            <span class="font-mono text-sm tabular-nums text-zinc-100 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${t.dot}"></span>${d.match_score}% · ${t.label}
            </span>
          </div>
          <div class="flex flex-wrap gap-1.5">${chipsOf(matched, 'bg-emerald-950/60 text-emerald-300 border-emerald-800/50')}</div>
          ${missingAll.length ? `<div class="text-xs text-zinc-400 font-medium mt-3 mb-1.5">Not mentioned in this role</div>
          <div class="flex flex-wrap gap-1.5" id="missing-chips">${chipsOf(missing, 'bg-zinc-900/80 text-zinc-400 border-zinc-800/80')}
            ${missingExtra > 0 ? `<button type="button" data-action="missing" aria-expanded="false" aria-controls="missing-chips" class="text-xs text-zinc-400 hover:text-zinc-200 underline cursor-pointer self-center" id="missing-toggle">+${missingExtra} more</button>` : ''}</div>` : ''}
        </div>

        <div class="mt-4 flex items-center gap-2">
          <button data-action="applied" class="px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-100 text-zinc-950 hover:bg-white shadow-sm transition">Mark Applied <kbd>a</kbd></button>
          <button data-action="saved"   class="px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-900 text-zinc-300 border border-zinc-700 hover:bg-zinc-800 transition">Save <kbd>s</kbd></button>
          <button data-action="archived" class="px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-900 text-zinc-300 border border-zinc-700 hover:bg-zinc-800 transition">Dismiss <kbd>x</kbd></button>
          <button data-action="prep" class="ml-auto px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-900 text-zinc-300 border border-zinc-700 hover:bg-zinc-800 transition">Generate Prep <kbd>p</kbd></button>
        </div>

        <div id="prep-summary-section" class="mt-5" ${d.summary ? '' : 'hidden'}>
          <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Interview prep</h3>
          <p id="prep-summary" class="text-sm leading-relaxed text-zinc-300">${esc(d.summary || '')}</p>
        </div>
        <div id="prep-bullets-section" class="mt-4" ${d.tailored_bullets ? '' : 'hidden'}>
          <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Key alignment</h3>
          <div id="prep-bullets" class="text-sm leading-relaxed text-zinc-300 whitespace-pre-line">${esc(d.tailored_bullets || '')}</div>
        </div>

        <div class="mt-5">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 font-medium mb-1.5">
            Description <span class="normal-case text-zinc-400 font-medium">· posted ${when || 'unknown'} · via ${esc(d.source || 'unknown')}</span>
          </h3>
          <div class="max-h-72 overflow-y-auto bg-zinc-900/60 border border-zinc-800 rounded-lg p-4 text-sm leading-relaxed text-zinc-300 whitespace-pre-line">${esc(d.raw_description || 'No description captured for this role.')}</div>
        </div>
      </div>`;
      $('#detail').dataset.id = String(d.id);
      $('#posting-link').replaceChildren(postingLink(d.url));
    }

    // Expand the capped 'missing terms' chip set in place.
    function toggleMissing(id){
      const d = detailCache.get(id);
      const box = document.getElementById('missing-chips');
      if (!d || !box || state.loading || String(id) !== state.selectedId) return;
      const all = Object.keys(d.match?.missing_terms || {}).sort();
      box.innerHTML = all.map(t2 =>
        `<span class="text-[11px] px-2 py-0.5 rounded-full font-mono bg-zinc-900/80 text-zinc-400 border border-zinc-800/80">${esc(t2)}</span>`
      ).join('') + `<button type="button" data-action="missing-less" aria-expanded="true" aria-controls="missing-chips" class="text-xs text-zinc-400 hover:text-zinc-200 underline cursor-pointer self-center">show less</button>`;
    }

    async function genPrep(id, btn){
      if (state.loading || String(id) !== state.selectedId) return;
      if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
      try {
        const r = await api(`/api/jobs/${encodeURIComponent(id)}/prep`, { method: 'POST' });
        const j = state.jobs.find(x => String(x.id) === String(id));
        if (j) { j.summary = r.summary; j.tailored_bullets = r.bullets.map(b => '- ' + b).join('\n'); }
        prepUpdates.set(String(id), {summary: r.summary, tailored_bullets: r.bullets.map(b => '- ' + b).join('\n')});
        const cached = detailCache.get(String(id));
        if (cached) { cached.summary = r.summary; cached.tailored_bullets = r.bullets.map(b => '- ' + b).join('\n'); }
        if (state.selectedId === String(id) && !state.loading && $('#detail').dataset.id === String(id) && $('#prep-summary')) {
          $('#prep-summary').textContent = r.summary;
          $('#prep-bullets').textContent = r.bullets.map(b => '- ' + b).join('\n');
          $('#prep-summary-section').hidden = !r.summary;
          $('#prep-bullets-section').hidden = !r.bullets.length;
        }
        if (btn) { btn.disabled = false; btn.innerHTML = 'Generate Prep <kbd>p</kbd>'; }
      } catch (e) {
        showError('Prep generation failed.');
        if (btn) { btn.disabled = false; btn.innerHTML = 'Generate Prep <kbd>p</kbd>'; }
      }
    }

    // ---------- optimistic triage + undo ---------- //
    function trackMutation(id, promise){
      pendingMutations.set(id, promise);
      promise.finally(() => {
        if (pendingMutations.get(id) === promise) pendingMutations.delete(id);
      });
      return promise;
    }

    function removeUndo(operationId){
      const index = undoStack.findIndex(op => op.operationId === operationId);
      if (index >= 0) undoStack.splice(index, 1);
    }

    function reconcileOperation(op, status, restoreFocus = false){
      detailCache.delete(op.id);
      if (state.loading) return; // the pending view fetch waits for this write
      if (op.viewKey !== viewKey()) {
        // Let the server apply search (including LIKE wildcards), category and
        // sorting rules; never splice a previous view's snapshot into this one.
        loadJobs(true);
        return;
      }
      const currentIndex = state.jobs.findIndex(j => String(j.id) === op.id);
      const job = { ...op.job, status };
      if (status === state.status) {
        if (currentIndex >= 0) state.jobs[currentIndex] = job;
        else state.jobs.splice(Math.min(op.index, state.jobs.length), 0, job);
      } else if (currentIndex >= 0) {
        state.jobs.splice(currentIndex, 1);
      }
      reconcileSelection(restoreFocus && status === state.status ? op.id : state.selectedId, op.index);
    }

    function postStatus(id, status){
      return api(`/api/jobs/${encodeURIComponent(id)}/status`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
    }

    function setStatus(id, newStatus){
      id = String(id);
      if (state.loading || pendingMutations.has(id)) return;
      const index = state.jobs.findIndex(j => String(j.id) === id);
      if (index < 0) return;
      const job = state.jobs[index];
      if (job.status === newStatus) return;
      const op = {
        operationId: ++operationSequence, id,
        beforeStatus: job.status, targetStatus: newStatus,
        viewKey: viewKey(), index, job: { ...job }, undoing: false, expiresAt: Date.now() + UNDO_MS,
      };
      undoStack.push(op);
      setTimeout(() => {
        removeUndo(op.operationId);
        if (toastOperationId === op.operationId) hideToast();
      }, UNDO_MS);
      reconcileOperation(op, newStatus);
      showToast(`Marked ${newStatus}`, undo, op.operationId);
      clearError();
      op.promise = postStatus(id, newStatus).then(() => {
        loadStats();
        return true;
      }).catch(() => {
        // This callback owns only this operation, even if later jobs changed.
        removeUndo(op.operationId);
        reconcileOperation(op, op.beforeStatus);
        showError('Status update failed — local change reverted. Refresh to verify server state.');
        return false;
      });
      return trackMutation(id, op.promise);
    }

    function undo(){
      if (state.loading) return;
      for (const expired of [...undoStack]) {
        if (expired.expiresAt <= Date.now()) removeUndo(expired.operationId);
      }
      const op = undoStack[undoStack.length - 1];
      if (!op) { showToast('Nothing to undo'); return; }
      if (op.undoing) return;
      op.undoing = true;
      hideToast(false);
      const promise = (async () => {
        // Undo must follow the original write, never race it on the server.
        if (!await op.promise) return false;
        try {
          await postStatus(op.id, op.beforeStatus);
          removeUndo(op.operationId);
          reconcileOperation(op, op.beforeStatus, true);
          loadStats();
          clearError();
          return true;
        } catch (e) {
          showError('Undo failed — retry undo or refresh to resync.');
          return false; // retain this exact history entry for retry
        } finally {
          op.undoing = false;
        }
      })();
      return trackMutation(op.id, promise);
    }

    // ---------- wiring ---------- //
    $('#rows').addEventListener('click', e => {
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'clear-filters') { clearFilters(); return; }
      if (action === 'retry-list') { loadJobs(); return; }
      const row = e.target.closest('.row');
      if (!row || state.loading) return;
      selectRow(state.jobs.findIndex(j => String(j.id) === row.dataset.id));
    });
    $('#rows').addEventListener('focusin', e => {
      const row = e.target.closest('.row');
      if (row && !state.loading) selectRow(state.jobs.findIndex(j => String(j.id) === row.dataset.id));
    });
    $('#detail').addEventListener('click', e => {
      const button = e.target.closest('button[data-action]');
      const id = $('#detail').dataset.id;
      if (!button || state.loading || id !== state.selectedId) return;
      switch (button.dataset.action) {
        case 'applied': case 'saved': case 'archived':
          setStatus(id, button.dataset.action); break;
        case 'prep': genPrep(id, button); break;
        case 'missing': toggleMissing(id); break;
        case 'missing-less': renderDetail(detailCache.get(id)); break;
      }
    });
    $('#errbar').addEventListener('click', e => {
      if (e.target.closest('[data-action="clear-error"]')) clearError();
    });
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.status = b.dataset.status; paintTabs(); loadJobs(); });
    document.querySelectorAll('.track-btn').forEach(b => b.onclick = () => {
      state.track = b.dataset.track;
      paintPills('.track-btn', 'track', state.track); // strip siblings, activate this group only
      loadJobs();
    });
    document.querySelectorAll('.dom-btn').forEach(b => b.onclick = () => {
      state.domain = b.dataset.domain;
      paintPills('.dom-btn', 'domain', state.domain);
      loadJobs();
    });
    $('#sort').onchange = e => { state.sort = e.target.value; loadJobs(); };

    const searchEl = $('#search');
    let searchTimer = null;
    searchEl.addEventListener('input', e => {
      state.search = e.target.value;
      clearTimeout(searchTimer);
      invalidateList(); // invalidate immediately, including the debounce window
      searchTimer = setTimeout(() => loadJobs(), 200);
    });

    document.addEventListener('keydown', e => {
      if (e.repeat || e.isComposing || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target?.isContentEditable ||
          e.target?.closest?.('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
      if (e.target?.closest?.('button, a')) return;
      const cur = state.loading ? null : selectedJob();
      const cursor = selectedIndex();
      switch (e.key) {
        case '/': e.preventDefault(); searchEl.focus(); return;
        case 'j': selectRow(Math.min(state.jobs.length - 1, cursor + 1)); return;
        case 'k': selectRow(Math.max(0, cursor - 1)); return;
        case 'z': undo(); return;
        case 'Escape': renderEmptyDetail(); return;
        case 'Enter': {
          const u = cur && safeUrl(cur.url);
          if (u) window.open(u, '_blank', 'noopener,noreferrer');
          return;
        }
      }
      if (!cur) return;
      if (e.key === 'a') setStatus(cur.id, 'applied');
      if (e.key === 's') setStatus(cur.id, 'saved');
      if (e.key === 'x') setStatus(cur.id, 'archived');
      if (e.key === 'p') genPrep(cur.id);
    });

    // ---------- boot ---------- //
    paintTabs();
    skeleton();
    loadStats();
    loadJobs();
    setInterval(() => { if (!document.hidden) loadStats(); }, 10000);
  </script>
</body>
</html>
